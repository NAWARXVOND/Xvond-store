services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: xvond_store
      POSTGRES_USER: xvond_store
      POSTGRES_PASSWORD: xvond_store
    ports:
      - "5432:5432"
    volumes:
      - xvond_store_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xvond_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  xvond_store_postgres:

